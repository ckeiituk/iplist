name: Fork Sync
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync fork with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/rekryt/iplist.git
          git fetch upstream
          git merge upstream/master --allow-unrelated-histories || echo "Merge conflicts or already up to date"
          git push origin master || echo "Nothing to push or push failed"
