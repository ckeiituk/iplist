name: Build YAML (source) → MRS from iplist

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths:
      - "config/**"
      - "src/**"
      - ".github/workflows/build-mrs.yml"
      - ".github/scripts/generate_yaml.go"
      - ".github/scripts/dedupe_yaml.go"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/.cache/go/bin
      GOPATH: ${{ github.workspace }}/.cache/go
      MIHOMO_VERSION: v1.19.14
      DEDUP_RULE_URL: https://raw.githubusercontent.com/legiz-ru/mihomo-rule-sets/main/ru-bundle/rule.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only setup Go + Actions cache (PHP not needed for Python script unless we omitted something?)
      # Wait, user project IS PHP project. 'src' dir exists. 
      # But if we use Python for generation, we might NOT need PHP at all for this workflow?
      # Does mihomo need PHP? No.
      # Does commit need PHP? No.
      # Does the user rely on 'composer install' for something else?
      # The previous workflow installed PHP deps.
      # If we skip them, we are fine.
      
      # Removing PHP setup massively speeds up setup too!
      
      # ===== Go + mihomo =====
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: false  # No go.sum in repo, cache handled manually

      - name: Restore mihomo binary cache
        id: mihomo-cache
        uses: actions/cache@v4
        with:
          path: .cache/go/bin/mihomo
          key: mihomo-${{ runner.os }}-${{ env.MIHOMO_VERSION }}

      - name: Install mihomo (ruleset converter)
        run: |
          mkdir -p "$GOBIN"
          echo "$GOBIN" >> $GITHUB_PATH
          if [[ -f "$GOBIN/mihomo" ]]; then
            echo "mihomo cached"
          else
            go install github.com/metacubex/mihomo@${MIHOMO_VERSION}
          fi
          "$GOBIN/mihomo" -v || true

      # ===== Caching External Lists =====
      - name: Cache external lists
        uses: actions/cache@v4
        with:
          path: .cache/external
          key: external-lists-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            external-lists-${{ runner.os }}-

      # ===== Генерация YAML (Go) =====
      - name: Generate YAML sources (Go)
        run: go run .github/scripts/generate_yaml.go

      # ===== Компиляция YAML → .mrs (параллельная + инкрементальная) =====
      - name: Compile YAML to .mrs (parallel + incremental)
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          process_file() {
             local f="$1"
             local behavior="$2"
             local dst_dir="$3"
             
             local name
             name=$(basename "${f%.yaml}")
             local mrs_file="$dst_dir/$name.mrs"
             
             # Проверка на пустой payload
             if ! awk '/^  - /{found=1; exit} END{exit found?0:1}' "$f"; then
               rm -f "$mrs_file"
               echo "[skip] empty payload: $f"
               return
             fi

             # Инкрементальная проверка: пропускаем если MRS новее YAML
             if [[ -f "$mrs_file" && "$mrs_file" -nt "$f" ]]; then
               # echo "[skip] up-to-date: $name.mrs"
               return
             fi
             
             mihomo convert-ruleset "$behavior" yaml "$f" "$mrs_file" || true
             echo "[ok] $behavior: $name.mrs"
          }
          export -f process_file

          prune_mrs() {
            local src="$1"
            local dst="$2"

            if [[ ! -d "$dst" ]]; then
              return
            fi

            find "$dst" -name "*.mrs" -print0 | while IFS= read -r -d '' f; do
              local name
              name="$(basename "${f%.mrs}")"
              local kind
              kind="$(basename "$(dirname "$f")")"
              local yaml="$src/$kind/$name.yaml"
              if [[ ! -f "$yaml" ]]; then
                rm -f "$f"
              fi
            done
          }
          
          compile_rulesets() {
            local src="$1"
            local dst="$2"

            mkdir -p "$dst/domain" "$dst/ipcidr"

            if [[ -d "$src/domain" ]]; then
              find "$src/domain" -name "*.yaml" -print0 | xargs -0 -P "$(nproc)" -I {} bash -c 'process_file "$1" domain "$2"' _ {} "$dst/domain"
            fi
            if [[ -d "$src/ipcidr" ]]; then
              find "$src/ipcidr" -name "*.yaml" -print0 | xargs -0 -P "$(nproc)" -I {} bash -c 'process_file "$1" ipcidr "$2"' _ {} "$dst/ipcidr"
            fi
          }

          echo "Starting parallel compilation..."
          prune_mrs dist/yaml dist/mrs
          compile_rulesets dist/yaml dist/mrs &
          pid_main=$!

          (
            go run .github/scripts/dedupe_yaml.go -src dist/yaml -dst dist/yaml-dedup -external-url "$DEDUP_RULE_URL"
            prune_mrs dist/yaml-dedup dist/mrs-dedup
            compile_rulesets dist/yaml-dedup dist/mrs-dedup
          ) &
          pid_dedup=$!

          wait "$pid_main" "$pid_dedup"
          echo "Compilation finished."

      # ===== Публикация артефактов =====
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rulesets
          path: |
            dist/yaml
            dist/mrs
            dist/yaml-dedup
            dist/mrs-dedup

      # ===== Коммит результатов =====
      - name: Commit YAML and MRS
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          files=(dist/yaml/domain/*.yaml dist/yaml/ipcidr/*.yaml dist/yaml-dedup/domain/*.yaml dist/yaml-dedup/ipcidr/*.yaml dist/mrs/domain/*.mrs dist/mrs/ipcidr/*.mrs dist/mrs-dedup/domain/*.mrs dist/mrs-dedup/ipcidr/*.mrs)

          if (( ${#files[@]} == 0 )); then
            echo "No files to commit."
            exit 0
          fi

          git add -f "${files[@]}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(rulesets): rebuild on $(date -u +%F:%T) UTC"
            git pull --rebase --autostash origin master
            git push
          fi
