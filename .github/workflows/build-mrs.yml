name: Build YAML (source) → MRS from iplist

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch: {}
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - "feature/**"
    paths:
      - "config/**"
      - "src/**"
      - ".github/workflows/build-mrs.yml"
      - ".github/scripts/generate_yaml.py"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/.cache/go/bin
      GOPATH: ${{ github.workspace }}/.cache/go
      MIHOMO_VERSION: v1.19.14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only setup Go + Actions cache (PHP not needed for Python script unless we omitted something?)
      # Wait, user project IS PHP project. 'src' dir exists. 
      # But if we use Python for generation, we might NOT need PHP at all for this workflow?
      # Does mihomo need PHP? No.
      # Does commit need PHP? No.
      # Does the user rely on 'composer install' for something else?
      # The previous workflow installed PHP deps.
      # If we skip them, we are fine.
      
      # Removing PHP setup massively speeds up setup too!
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ===== Go + mihomo =====
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: true

      - name: Restore Go bin cache (mihomo)
        uses: actions/cache@v4
        with:
          path: .cache/go/bin
          key: go-bin-${{ runner.os }}-mihomo-${{ env.MIHOMO_VERSION }}

      - name: Restore Go mod cache
        uses: actions/cache@v4
        with:
          path: .cache/go/pkg/mod
          key: go-mod-${{ runner.os }}-mihomo-${{ env.MIHOMO_VERSION }}
          restore-keys: |
            go-mod-${{ runner.os }}-

      - name: Install mihomo (ruleset converter)
        run: |
          echo "$GOBIN" >> $GITHUB_PATH
          if command -v mihomo >/dev/null 2>&1 && mihomo -v | grep -q "${MIHOMO_VERSION#v}"; then
            echo "mihomo cached"
          else
            go install github.com/metacubex/mihomo@${MIHOMO_VERSION}
          fi
          mihomo -v || true

      # ===== Генерация YAML (Python) =====
      - name: Generate YAML sources (Python)
        run: python3 .github/scripts/generate_yaml.py

      # ===== Компиляция YAML → .mrs (Parallel) =====
      - name: Compile YAML to .mrs (Parallel)
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          mkdir -p dist/mrs/domain dist/mrs/ipcidr
          
          process_file() {
             local f="$1"
             local behavior="$2"
             local dst_dir="$3"
             if ! awk '/^  - /{found=1; exit} END{exit found?0:1}' "$f"; then
               echo "[skip] empty payload: $f"
               return
             fi
             local name
             name=$(basename "${f%.yaml}")
             mihomo convert-ruleset "$behavior" yaml "$f" "$dst_dir/$name.mrs"
             echo "[ok] $behavior: $name.mrs"
          }
          export -f process_file
          
          find dist/yaml/domain -name "*.yaml" -print0 | xargs -0 -P $(nproc) -I {} bash -c "process_file '{}' domain dist/mrs/domain"
          find dist/yaml/ipcidr -name "*.yaml" -print0 | xargs -0 -P $(nproc) -I {} bash -c "process_file '{}' ipcidr dist/mrs/ipcidr"

      # ===== Публикация артефактов =====
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rulesets
          path: |
            dist/yaml
            dist/mrs

      # ===== Коммит результатов =====
      - name: Commit YAML and MRS
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          files=(dist/yaml/domain/*.yaml dist/yaml/ipcidr/*.yaml dist/mrs/domain/*.mrs dist/mrs/ipcidr/*.mrs)

          if (( ${#files[@]} == 0 )); then
            echo "No files to commit."
            exit 0
          fi

          git add -f "${files[@]}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(rulesets): rebuild on $(date -u +%F:%T) UTC"
            git pull --rebase --autostash origin master
            git push
          fi
