name: Build YAML (source) → MRS from iplist

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths:
      - "config/**"
      - "src/**"
      - ".github/workflows/build-mrs.yml"
      - ".github/scripts/generate_yaml.py"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/.cache/go/bin
      GOPATH: ${{ github.workspace }}/.cache/go
      MIHOMO_VERSION: v1.19.14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only setup Go + Actions cache (PHP not needed for Python script unless we omitted something?)
      # Wait, user project IS PHP project. 'src' dir exists. 
      # But if we use Python for generation, we might NOT need PHP at all for this workflow?
      # Does mihomo need PHP? No.
      # Does commit need PHP? No.
      # Does the user rely on 'composer install' for something else?
      # The previous workflow installed PHP deps.
      # If we skip them, we are fine.
      
      # Removing PHP setup massively speeds up setup too!
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ===== Go + mihomo =====
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: false  # No go.sum in repo, cache handled manually

      - name: Restore mihomo binary cache
        id: mihomo-cache
        uses: actions/cache@v4
        with:
          path: .cache/go/bin/mihomo
          key: mihomo-${{ runner.os }}-${{ env.MIHOMO_VERSION }}

      - name: Install mihomo (ruleset converter)
        run: |
          mkdir -p "$GOBIN"
          echo "$GOBIN" >> $GITHUB_PATH
          if [[ -f "$GOBIN/mihomo" ]]; then
            echo "mihomo cached"
          else
            go install github.com/metacubex/mihomo@${MIHOMO_VERSION}
          fi
          "$GOBIN/mihomo" -v || true

      # ===== Генерация YAML (Python) =====
      - name: Generate YAML sources (Python)
        run: python3 .github/scripts/generate_yaml.py

      # ===== Компиляция YAML → .mrs =====
      - name: Compile YAML to .mrs
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          mkdir -p dist/mrs/domain dist/mrs/ipcidr

          convert_yaml_dir() {
            local behavior="$1"   # domain | ipcidr
            local src_dir="$2"    # dist/yaml/domain | dist/yaml/ipcidr
            local dst_dir="$3"    # dist/mrs/domain  | dist/mrs/ipcidr
            local count=0
            for f in "$src_dir"/*.yaml; do
              # пустые payload тоже возможны — пропустим
              if ! awk '/^  - /{found=1; exit} END{exit found?0:1}' "$f"; then
                echo "[skip] empty payload: $f"
                continue
              fi
              mihomo convert-ruleset "$behavior" yaml "$f" "$dst_dir/$(basename "${f%.yaml}").mrs" || true
              echo "[ok] $behavior: $dst_dir/$(basename "${f%.yaml}").mrs"
              ((count++)) || true
            done
            echo "[summary] $behavior compiled: $count files"
          }

          convert_yaml_dir domain dist/yaml/domain dist/mrs/domain
          convert_yaml_dir ipcidr dist/yaml/ipcidr dist/mrs/ipcidr

      # ===== Публикация артефактов =====
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rulesets
          path: |
            dist/yaml
            dist/mrs

      # ===== Коммит результатов =====
      - name: Commit YAML and MRS
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          files=(dist/yaml/domain/*.yaml dist/yaml/ipcidr/*.yaml dist/mrs/domain/*.mrs dist/mrs/ipcidr/*.mrs)

          if (( ${#files[@]} == 0 )); then
            echo "No files to commit."
            exit 0
          fi

          git add -f "${files[@]}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(rulesets): rebuild on $(date -u +%F:%T) UTC"
            git pull --rebase --autostash origin master
            git push
          fi
